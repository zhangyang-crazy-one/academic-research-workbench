name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    needs: package-boundary
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: academic-research-workbench-ci-${{ github.sha }}
          path: build/candidate-from-ci-transfer
      - name: Extract candidate with hidden files and executable modes
        run: python scripts/candidate-bundle extract --archive build/candidate-from-ci-transfer/candidate-bundle.tar.gz --output-root build/candidate-from-ci
      - name: Select the exact gated candidate for stage regressions
        run: |
          python scripts/candidate-bundle verify --bundle-root build/candidate-from-ci
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('build/candidate-from-ci').resolve()
          artifacts = json.loads((root / 'build-evidence.json').read_text())['artifacts']
          wheels = [item for item in artifacts if item['kind'] == 'wheel']
          assert len(wheels) == 1, wheels
          with Path(os.environ['GITHUB_ENV']).open('a') as output:
              output.write(f"ARW_CANDIDATE_WHEEL={root / wheels[0]['path']}\n")
              output.write(f"ARW_BUILD_EVIDENCE={root / 'build-evidence.json'}\n")
              output.write(f"ARW_CANDIDATE_EVIDENCE_ROOT={root / 'evidence'}\n")
          PY
      - name: Resolve development environment from declared ranges
        run: >-
          uv venv && .venv/bin/python scripts/install-unmanaged-deps.py
          --all-extras dev ars-test storm
      - name: Materialize pinned source snapshots
        run: |
          ./scripts/materialize-sources --clean
      - name: Verify source manifest wire digests
        env:
          PYTHONNOUSERSITE: "1"
          UV_OFFLINE: "1"
        run: >-
          .venv/bin/python -m pytest -q
          tests/integration/test_source_materialization.py::test_exact_snapshots_patch_and_canonical_license_paths_are_materialized
          tests/integration/test_source_materialization.py::test_materializer_tree_digest_uses_the_manifest_wire_encoding
      - name: Run non-host contract and provenance tests
        env:
          PYTHONNOUSERSITE: "1"
          UV_OFFLINE: "1"
        run: >-
          .venv/bin/python -m pytest -q
          tests/unit
          tests/schema
          tests/unit/test_integration_lock.py
      - name: Run v2 compatibility baseline
        env:
          PYTHONNOUSERSITE: "1"
          UV_OFFLINE: "1"
        # tests/compat is listed explicitly: a bare marker run still
        # COLLECTS the whole tests/ tree, and host-dependent integration
        # modules (e.g. phase-07 installed E2E) fail collection on runners
        # without an installed Codex binary. Path-scoping avoids that.
        # The native-binary golden (test_filebase_mcp_contract.py) skips on
        # clean runners BY DESIGN: PR CI has no pinned C toolchain, and
        # building here would rebaseline vendor/source-manifest.json with
        # toolchain-drifted hashes. Native-binary-dependent suites (native
        # surface, confinement, file security) run in the local
        # qualification flow (scripts/verify-phase-*), matching release.yml.
        # The package-boundary job uses the committed digest-bound pre-vendor
        # receipt and runs the candidate license gate for this CI wheel.
        # Native host qualification remains a separate retained workflow.
        run: >-
          .venv/bin/python -m pytest -q -m v2_compat tests/compat
      - name: Run Phase 4 lifecycle and hook regression tests
        env:
          PYTHONNOUSERSITE: "1"
          UV_OFFLINE: "1"
        run: >-
          .venv/bin/python -m pytest -q
          tests/unit/test_hook_contracts.py
          tests/unit/test_orchestration_models.py
          tests/unit/test_orchestration_cli.py
          tests/unit/test_scheduler.py
          tests/integration/test_human_gates.py
          tests/integration/test_orchestration_hook_parity.py
          tests/integration/test_orchestration_lifecycle.py
          tests/integration/test_orchestration_panels.py
          tests/integration/test_orchestration_replay.py
          tests/integration/test_phase4_verifier.py
      - name: Run store inventory and audit regressions
        env:
          PYTHONNOUSERSITE: "1"
          UV_OFFLINE: "1"
        run: >-
          .venv/bin/python -m pytest -q
          tests/integration/test_files_store_inventory_binding.py
          tests/integration/test_files_store_mcp_history.py
          tests/integration/test_files_store_mcp_lifecycle.py
          tests/integration/test_semantica_conflict_policies.py
          tests/integration/test_semantica_lite.py
          tests/integration/test_semantica_audit_reconciliation.py
      - name: Run artifact inspection and acceptance regressions
        env:
          PYTHONNOUSERSITE: "1"
          UV_OFFLINE: "1"
        run: >-
          .venv/bin/python -m pytest -q
          tests/integration/test_artifact_integrity_cli.py
          tests/integration/test_artifact_sanitize.py
      - name: Run research artifact, memory and learning regressions
        env:
          PYTHONNOUSERSITE: "1"
          UV_OFFLINE: "1"
        run: >-
          .venv/bin/python -m pytest -q
          tests/integration/test_research_artifacts.py
          tests/integration/test_research_memory.py
          tests/integration/test_research_learning.py tests/integration/test_writing.py
      - name: Run binary format and provider-extraction regressions
        run: .venv/bin/python -m pytest -q tests/integration/test_binary_metadata.py tests/integration/test_extension_extraction.py tests/unit/test_storm.py
      - name: Run optional offline semantic retrieval regressions
        env:
          PYTHONNOUSERSITE: "1"
          UV_OFFLINE: "1"
        run: .venv/bin/python -m pytest -q tests/integration/test_semantic_retrieval.py
      - name: Run bundled ARS self-tests
        working-directory: skills/academic-research-suite/ars
        env:
          PYTHONNOUSERSITE: "1"
          UV_OFFLINE: "1"
        run: >-
          ../../../.venv/bin/python -m pytest -q
          --ignore scripts/test_check_calibration_tiers.py
          --ignore scripts/test_check_distribution_surface_claims.py

  package-boundary:
    name: Wheel and source archive boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Resolve package boundary environment from declared ranges
        run: uv venv && .venv/bin/python scripts/install-unmanaged-deps.py dev
      - name: Restore pinned legal receipt and materialize source snapshots
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('vendor/source-manifest.json').read_text())
          receipt = Path('supply-chain/pre-vendor-receipt.json')
          target = Path(manifest['pre_vendor_receipt']['path'])
          sha = hashlib.sha256(receipt.read_bytes()).hexdigest()
          assert sha == manifest['pre_vendor_receipt']['sha256'], 'pinned legal receipt digest mismatch'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(receipt.read_bytes())
          target.with_name('receipt.sha256').write_text(sha + '\n')
          PY
          ./scripts/materialize-sources
          (cd vendor/sources/file-base/graph-ui && npm ci --ignore-scripts --silent)
          notice=build/evidence/phase-01/pre-vendor-license/generated/THIRD_PARTY_NOTICES.md
          ./vendor/sources/file-base/scripts/gen-third-party-notices.sh "$notice"
          python -c "import shutil; shutil.rmtree('vendor/sources/file-base/graph-ui/node_modules')"
          python scripts/verify-pinned-notice
          ./scripts/verify-sources --inputs-only
      - name: Resolve native legal checker from configured index
        run: |
          uv pip install --python .venv/bin/python 'scancode-toolkit>=32.5.0'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify publish surface before building artifacts
        run: |
          test -f src/arw/kernel/execution/orchestration.py
          test -f hooks/arw_hook.py
          test -x scripts/prepare-qualified-stage
          test -x scripts/create-marketplace
          python - <<'PY'
          import json
          from pathlib import Path

          hooks = json.loads(Path('hooks/hooks.json').read_text())
          commands = [
              item['command']
              for groups in hooks['hooks'].values()
              for matcher in groups
              for item in matcher['hooks']
          ]
          assert commands, 'no lifecycle hooks configured'
          assert all(
              '${PLUGIN_ROOT}' in command for command in commands
          ), commands
          assert any('arw_hook.py' in command for command in commands), commands
          PY
      - name: Build one candidate and generate its isolated legal evidence
        run: |
          .venv/bin/python scripts/build-candidate --output-root build/candidate-ci
          python - <<'PY'
          import json
          from pathlib import Path

          artifacts = json.loads(Path('build/candidate-ci/build-evidence.json').read_text())['artifacts']
          wheels = [item for item in artifacts if item['kind'] == 'wheel']
          assert len(wheels) == 1, wheels
          with Path('build/candidate-ci/wheel-path.txt').open('w') as stream:
              stream.write(str(Path('build/candidate-ci') / wheels[0]['path']) + '\n')
          PY
          wheel="$(cat build/candidate-ci/wheel-path.txt)"
          .venv/bin/python scripts/license-gate \
            --wheel "$wheel" \
            --build-evidence build/candidate-ci/build-evidence.json \
            --output-root build/evidence/candidate-ci
          .venv/bin/python scripts/candidate-bundle create \
            --wheel "$wheel" \
            --build-evidence build/candidate-ci/build-evidence.json \
            --candidate-evidence-root build/evidence/candidate-ci \
            --output-root build/candidate-bundle-ci
          .venv/bin/python scripts/candidate-bundle verify \
            --bundle-root build/candidate-bundle-ci
          .venv/bin/python scripts/candidate-bundle archive \
            --bundle-root build/candidate-bundle-ci --output build/candidate-bundle.tar.gz
          test -s build/candidate-bundle.tar.gz
      - name: Inspect candidate wheel and source archive boundaries
        run: |
          python - <<'PY'
          import json
          import tarfile
          from pathlib import Path
          from zipfile import ZipFile

          root = Path('build/candidate-bundle-ci')
          artifacts = json.loads((root / 'build-evidence.json').read_text())['artifacts']
          wheel = next(root / item['path'] for item in artifacts if item['kind'] == 'wheel')
          source = next(root / item['path'] for item in artifacts if item['kind'] == 'sdist')
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          with tarfile.open(source) as archive:
              source_names = archive.getnames()
          forbidden = (
              '.planning/',
              'build/',
              '.evidence/',
              '.file-base/',
              'vendor/sources/',
          )
          leaked = [name for name in names if name.startswith(forbidden)]
          assert not leaked, leaked
          assert not any(any(part in {'.planning', 'build', '.evidence', '.file-base',
                                      '.env', 'credentials', 'secrets'}
                             for part in Path(name).parts) or 'vendor/sources/' in name
                         for name in source_names), source_names
          PY
      - name: Run focused candidate artifact regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          .venv/bin/python -m pytest -q --confcutdir=tests/unit \
            -p no:cacheprovider tests/unit/test_candidate_gate.py
          .venv/bin/python -m pytest -q --confcutdir=tests/integration \
            -p no:cacheprovider tests/integration/test_candidate_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: academic-research-workbench-ci-${{ github.sha }}
          path: build/candidate-bundle.tar.gz
          if-no-files-found: error
