name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.28'
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --frozen --all-groups
      - name: Materialize and verify pinned source inputs
        run: |
          ./scripts/materialize-sources --clean
          ./scripts/verify-sources --inputs-only
      - name: Run non-host contract and provenance tests
        env:
          PYTHONNOUSERSITE: '1'
          UV_OFFLINE: '1'
        run: >-
          uv run pytest -q
          tests/unit
          tests/schema
          tests/integration/test_license_gate.py
          tests/unit/test_integration_lock.py
      - name: Run Phase 4 lifecycle and hook regression tests
        env:
          PYTHONNOUSERSITE: '1'
          UV_OFFLINE: '1'
        run: >-
          uv run pytest -q
          tests/unit/test_hook_contracts.py
          tests/unit/test_orchestration_models.py
          tests/unit/test_orchestration_cli.py
          tests/unit/test_scheduler.py
          tests/integration/test_human_gates.py
          tests/integration/test_orchestration_hook_parity.py
          tests/integration/test_orchestration_lifecycle.py
          tests/integration/test_orchestration_panels.py
          tests/integration/test_orchestration_replay.py
          tests/integration/test_phase4_verifier.py

  package-boundary:
    name: Wheel and source archive boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.28'
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Verify publish surface before building artifacts
        run: |
          test -f src/arw/orchestration.py
          test -f hooks/arw_hook.py
          test -x scripts/prepare-qualified-stage
          test -x scripts/create-marketplace
          python - <<'PY'
          import json
          from pathlib import Path

          hooks = json.loads(Path('hooks/hooks.json').read_text())
          commands = [
              item['command']
              for groups in hooks['hooks'].values()
              for matcher in groups
              for item in matcher['hooks']
          ]
          assert commands, 'no lifecycle hooks configured'
          assert all('${PLUGIN_ROOT}' in command for command in commands), commands
          assert any('arw_hook.py' in command for command in commands), commands
          PY
      - name: Build wheel and inspect payload
        run: |
          uv build --out-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          forbidden = ('.planning/', 'build/', '.evidence/', '.file-base/', 'vendor/sources/')
          leaked = [name for name in names if name.startswith(forbidden)]
          assert not leaked, leaked
          PY
      - name: Build source archive with export rules
        run: |
          mkdir -p dist/source
          git archive --worktree-attributes --format=tar --output=dist/source/arw.tar HEAD
          tar -tf dist/source/arw.tar > dist/source/files.txt
          ! grep -E '(^|/)(\.planning|build|\.evidence|\.file-base|vendor/sources)(/|$)' dist/source/files.txt
          ! grep -E '(^|/)(\.env|credentials|secrets)(/|$)' dist/source/files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: academic-research-workbench-ci-${{ github.sha }}
          path: dist/
