[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "academic-research-workbench"
version = "0.1.0"
description = "Headless, auditable research-workflow control plane for Codex."
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "platformdirs>=4.11.12",
    "portalocker>=4.4.0",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
artifact-formats = ["pypdf>=6.19.0", "pillow>=12.3.0"]
scholarly-pdf = ["pypdf>=6.19.0", "docling>=2.130.0"]
semantic = ["sqlite-vec>=0.1.9"]

[dependency-groups]
dev = ["hatchling>=1.32.4", "packaging>=26.3", "PyYAML>=6.0.3", "pytest>=9.1.1", "ruff>=0.16.8", "pyright>=1.1.414"]
ars-test = [
  "defusedxml>=0.7.1",
  "jsonschema[format]>=4.17",
  "pypdf>=6.19.0",
  "ruamel-yaml>=0.19.1",
]
storm = [
  "knowledge-storm>=1.1.1",
  "sentence-transformers>=6.1.0",
  "tavily-python>=0.8.4",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/arw",
    "extensions/ars/src/arw_ars",
    "extensions/storm/src/arw_storm",
    "extensions/local-store/src/arw_ext",
    "extensions/semantica/src/arw_semantica",
    "extensions/artifact-integrity/src/arw_artifact_integrity",
    "extensions/research-artifact/src/arw_research_artifact",
    "extensions/research-memory/src/arw_research_memory",
    "extensions/research-learning/src/arw_research_learning",
    "extensions/academic-humanization/src/arw_writing",
    "extensions/submission-workflow/src/arw_submission_workflow",
]

[tool.hatch.build.hooks.custom]
path = "build_hooks.py"

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-ra"]
testpaths = ["tests"]
markers = [
  "codex_host: exercises an authenticated fresh Codex host against installed plugin bytes",
  "requires_native_file_base: needs the executable .file-base/bin/file-base",
  "requires_materialized_sources: needs pinned snapshots under vendor/sources",
  "requires_offline_network_isolation: needs Linux, usable strace, and a working bwrap or unshare network namespace",
  "requires_retained_evidence(*paths): needs retained evidence paths or env:VARIABLE inputs",
  "v2_compat: v2 compatibility baseline — pins v1 CLI/MCP/replay/projection contracts (tests/compat)",
]

[tool.uv]
managed = false
package = true
required-version = ">=0.11.28"
