<svg xmlns="http://www.w3.org/2000/svg" width="180.0mm" height="323.497mm" viewBox="0 0 510.23622047244095 916.9993700787402"><desc>{"source_sha256": "4c92dfee4b94b0277197bf58a6527a4da5963ea9836c68eb35aba90a071fd5b1", "profile": "Author-defined synthetic mechanism profile, 180 mm, 8 pt minimum; not venue certification", "candidate_exception": "Milestone 1: author-specified mechanism layout; three explanation strategies are deferred."}</desc><text id="mechanism.claim" font-size="9.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="18.0">[synthetic] One-hot lookup then sequence summation produces the supplied count</tspan><tspan x="12" y="31.049999999999997">vector.</tspan></text><text id="mechanism.question" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="43.0">How does this fixed token sequence become a count vector?</tspan></text><defs><marker id="arrow.data" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#0072b2" /></marker><marker id="arrow.condition" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#7a5195" /></marker><marker id="arrow.control" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#333333" /></marker><marker id="arrow.retrieval" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#00796b" /></marker><marker id="arrow.action" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#a85100" /></marker><marker id="arrow.observation" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#005f73" />