s: frozen</tspan></text><rect x="60.0" y="320.20000000000005" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.project.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="331.20000000000005">1. E(red)=[1,0]; E(blue)=[0,1].</tspan></text><line x1="253.0" x2="253.0" y1="339.80000000000007" y2="347.80000000000007" stroke="#0072b2" stroke-width="1" marker-end="url(#arrow.data)" /><rect x="60.0" y="348.80000000000007" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.project.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="359.80000000000007">2. Lookup X=[E(red), E(blue)].</tspan></text><line x1="253.0" x2="253.0" y1="368.4000000000001" y2="376.4000000000001" stroke="#0072b2" stroke-width="1" marker-end="url(#arrow.data)" /><rect x="60.0" y="377.4000000000001" width="386.0" height="80.0" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.project.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="388.4000000000001">3. Sum sequence axis: y=[1,1].</tspan></text><text id="coordinate.project.axis-label" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="405.0000000000001">coordinate</tspan></text><text id="coordinate.project.axis.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="192.0" y="405.0000000000001">red</tspan></text><text id="coordinate.project.axis.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="314.0" y="405.0000000000001">blue</tspan></text><text id="coordinate.project.operand.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="416.60000000000014">E(red)</tspan></text><text id="coordinate.project.0.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="192.0" y="416.60000000000014">1</tspan></text><text id="coordinate.project.0.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="314.0" y="416.60000000000014">0</tspan></text><text id="coordinate.project.operand.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="428.2000000000001">E(blue)</tspan></text><text id="coordinate.project.1.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="192.0" y="428.2000000000001">0</tspan></text><text id="coordinate.project.1.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="314.0" y="428.2000000000001">1</tspan></text><line id="coordinate.project.sum-bar" x1="70.0" x2="436.0" y1="434.8000000000001" y2="434.8000000000001" stroke="#333333" /><text id="coordinate.project.result" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="445.8000000000001">y</tspan></text><text id="coordinate.project.sum.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="192.0" y="445.8000000000001">1 + 0 = 1</tspan></text><text id="coordinate.project.sum.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="314.0" y="445.8000000000001">0 + 1 = 1</tspan></text><text id="label.project.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="470.4000000000001">input input: tokens / utterance@tokens</tspan></text><text id="label.project.6" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="482.0000000000001">output out: vector2 / utterance@sum</tspan></text></g><circle id="port.project.input" cx="48.0" cy="427.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.project.out" cx="458.0" cy="427.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.result"><rect id="body.result" x="48.0" y="614.0" width="410.0" height="160.0" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1" /><g id="content.result"><text id="label.result.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="632.0">Representation before and after</tspan></text><text id="label.result.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="643.6">conceptual | inference | parameters: not_applicable</tspan></text><text id="label.result.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="660.2">Retain the utterance identity; no trained attention.</tspan></text><rect x="60.0" y="663.8000000000001" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.result.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="66.0" y="675.8000000000001">before: red, blue (ordered</tspan><tspan x="66.0" y="687.4000000000001">tokens)</tspan></text><rect x="263.0" y="663.8000000000001" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.result.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="269.0" y="675.8000000000001">after: y=[1,1] (two-dimensional</tspan><tspan x="269.0" y="687.4000000000001">count vector)</tspan></text><text id="label.result.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="243.0" y="675.8000000000001">-&gt;</tspan></text><text id="label.result.6" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="715.0000000000001">input input: vector2 / utterance@sum</tspan></text></g><circle id="port.result.input" cx="48.0" cy="694.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g></svg>
