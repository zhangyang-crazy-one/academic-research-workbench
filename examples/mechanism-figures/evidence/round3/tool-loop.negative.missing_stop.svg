<svg xmlns="http://www.w3.org/2000/svg" width="180.0mm" height="500.0mm" viewBox="0 0 510.23622047244095 1417.3228346456694"><desc>{"source_sha256": "2b7f782594a480498ac7b6f7e233adc9c4ae5803abe9b7cc977af53d80a71d3f", "profile": "Author-defined synthetic mechanism profile, 180 mm, 8 pt minimum; not venue certification", "candidate_exception": "Milestone 1: author-specified mechanism layout; three explanation strategies are deferred."}</desc><text id="mechanism.claim" font-size="9.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="18.0">[synthetic] An observation updates episode state; an explicit predicate selects</tspan><tspan x="12" y="31.049999999999997">retry or stop.</tspan></text><text id="mechanism.question" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="43.0">When does the tool loop return and when does it stop?</tspan></text><defs><marker id="arrow.data" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#0072b2" /></marker><marker id="arrow.condition" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#7a5195" /></marker><marker id="arrow.control" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#333333" /></marker><marker id="arrow.retrieval" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#00796b" /></marker><marker id="arrow.action" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#a85100" /></marker><marker id="arrow.observation" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#005f73" /></marker><marker id="arrow.supervision" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#8c2d5d" /></marker><marker id="arrow.parameter_update" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#8b0000" /></marker></defs><polyline id="edge.initialized" points="458.0,155.0 478.0,155.0 478.0,304.0 30.0,304.0 30.0,372.0 48.0,372.0" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#arrow.control)" /><text id="edge-label.initialized" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="225.4" y="297.0">initialized</tspan></text><text id="relation.initialized" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="1220.0">initialized [control]: new episode, initialized exactly once; when new episode only</tspan></text><polyline id="edge.call" points="458.0,397.0 478.0,397.0 478.0,496.0 30.0,496.0 30.0,606.5 48.0,606.5" fill="none" stroke="#a85100" stroke-width="1.2" stroke-dasharray="" marker-end="url(#arrow.action)" /><text id="edge-label.call" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="243.6" y="489.0">call</tspan></text><text id="relation.call" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="1254.0">call [action]: lookup request and arguments; when always</tspan></text><polyline id="edge.observed" points="458.0,606.5 478.0,606.5 478.0,723.0 30.0,723.0 30.0,856.0 48.0,856.0" fill="none" stroke="#005f73" stroke-width="1.2" stroke-dasharray="5 2" marker-end="url(#arrow.observation)" /><text id="edge-label.observed" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="233.2" y="716.0">observed</tspan></text><text id="relation.observed" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="1288.0">observed [observation]: updated episode and history; when always</tspan></text><polyline id="edge.retry" points="458.0,817.6666666666666 498.0,817.6666666666666 498.0,270.0 16.0,270.0 16.0,422.0 48.0,422.0" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#arrow.control)" /><text id="edge-label.retry" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="244.0" y="263.0">retry</tspan></text><text id="relation.retry" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="1322.0">retry [control]: same observed episode; when not answer_present AND attempts &lt; 2; feedback</tspan></text><polyline id="edge.stop" points="458.0,894.3333333333334 478.0,894.3333333333334 478.0,995.0 30.0,995.0 30.0,1093.0 48.0,1093.0" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#arrow.control)" /><text id="edge-label.stop" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="243.6" y="988.0">stop</tspan></text><text id="relation.stop" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="1356.0">stop [control]: terminal episode; when answer_present OR attempts &gt;= 2</tspan></text><g id="component.initialize"><rect id="body.initialize" x="48.0" y="70.0" width="410.0" height="170.0" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1" /><g id="content.initialize"><text id="label.initialize.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="88.0">Initialize once per episode</tspan></text><text id="label.initialize.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="99.6">conceptual | inference | parameters: not_applicable</tspan></text><text id="label.initialize.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="116.19999999999999">Initial state: attempts=0 and answer_present=false.</tspan></text><text id="label.initialize.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="127.79999999999998">Once per episode; retry bypasses this state.</tspan></text><rect x="60.0" y="131.39999999999998" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.initialize.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="66.0" y="143.39999999999998">before: New episode</tspan></text><rect x="263.0" y="131.39999999999998" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.initialize.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="269.0" y="143.39999999999998">after: attempts=0;</tspan><tspan x="269.0" y="154.99999999999997">answer_present=false</tspan></text><text id="label.initialize.6" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="243.0" y="143.39999999999998">-&gt;</tspan></text><text id="label.initialize.7" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="182.59999999999997">output out: episode / episode@initial</tspan></text></g><circle id="port.initialize.out" cx="458.0" cy="155.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.request"><rect id="body.request" x="48.0" y="322.0" width="410.0" height="150.0" rx="0" fill="#ffffff" stroke="#555555" stroke-width="1" /><g id="content.request"><text id="label.request.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="340.0">Prepare a deterministic tool request</tspan></text><text id="label.request.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="351.6">conceptual | inference | parameters: not_applicable</tspan></text><rect x="60.0" y="360.20000000000005" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.request.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="371.20000000000005">1. Increment attempts; request lookup(key=public-toy).</tspan></text><text id="label.request.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="392.80000000000007">input initial: episode / episode@initial</tspan></text><text id="label.request.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="404.4000000000001">input input: episode / episode@observed</tspan></text><text id="label.request.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="416.0000000000001">output out: request / call@prepared</tspan></text></g><circle id="port.request.initial" cx="48.0" cy="372.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.request.input" cx="48.0" cy="422.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.request.out" cx="458.0" cy="397.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.observe"><rect id="body.observe" x="48.0" y="514.0" width="410.0" height="185.0" rx="0" fill="#ffffff" stroke="#555555" stroke-width="1" /><g id="content.observe"><text id="label.observe.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="532.0">Read observation and update state</tspan></text><text id="label.observe.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="543.6">conceptual | inference | parameters: not_applicable</tspan></text><rect x="60.0" y="552.2" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.observe.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="563.2">1. Synthetic lookup returns found or missing.</tspan></text><line x1="253.0" x2="253.0" y1="571.8000000000001" y2="579.8000000000001" stroke="#0072b2" stroke-width="1" marker-end="url(#arrow.data)" /><rect x="60.0" y="580.8000000000001" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.observe.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="591.8000000000001">2. Append observation to event history.</tspan></text><line x1="253.0" x2="253.0" y1="600.4000000000001" y2="608.4000000000001" stroke="#0072b2" stroke-width="1" marker-end="url(#arrow.data)" /><rect x="60.0" y="609.4000000000001" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.observe.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="620.4000000000001">3. Set answer_present=(observation == found).</tspan></text><text id="label.observe.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="642.0000000000001">input input: request / call@prepared</tspan></text><text id="label.observe.6" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="653.6000000000001">output out: episode / episode@observed</tspan></text></g><circle id="port.observe.input" cx="48.0" cy="606.5" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.observe.out" cx="458.0" cy="606.5" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.decide"><rect id="body.decide" x="48.0" y="741.0" width="410.0" height="230.0" rx="8" fill="#eff7fb" stroke="#0072b2" stroke-width="2" /><g id="content.decide"><text id="label.decide.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="759.0">INNOVATION: Bounded return or stop</tspan></text><text id="label.decide.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="770.6">conceptual | inference | parameters: not_applicable</tspan></text><text id="label.decide.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="787.2">Check answer_present and attempts &lt; 2.</tspan></text><rect x="60.0" y="806.8666666666667" width="356.0" height="21.6" fill="#ffffff" stroke="#333333" /><text id="predicate.decide.again" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="66.0" y="819.8666666666667">continue: not answer_present AND attempts &lt; 2</tspan></text><line id="predicate-link.decide.again" x1="416.0" y1="817.6666666666666" x2="458.0" y2="817.6666666666666" stroke="#333333" /><rect x="60.0" y="883.5333333333334" width="356.0" height="21.6" fill="#ffffff" stroke="#333333" /><line id="predicate-link.decide.done" x1="416.0" y1="894.3333333333334" x2="458.0" y2="894.3333333333334" stroke="#333333" /><text id="label.decide.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="923.1333333333334">input input: episode / episode@observed</tspan></text><text id="label.decide.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="934.7333333333335">output again: episode / episode@observed</tspan></text><text id="label.decide.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="946.3333333333335">output done: episode / episode@stopped</tspan></text></g><circle id="port.decide.input" cx="48.0" cy="856.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.decide.again" cx="458.0" cy="817.6666666666666" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.decide.done" cx="458.0" cy="894.3333333333334" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.done"><rect id="body.done" x="48.0" y="1013.0" width="410.0" height="160.0" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1" /><g id="content.done"><text id="label.done.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="1031.0">Terminal episode state</tspan></text><text id="label.done.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="1042.6">conceptual | inference | parameters: not_applicable</tspan></text><text id="label.done.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="1059.1999999999998">Return retained observation, without another request.</tspan></text><rect x="60.0" y="1062.7999999999997" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.done.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="66.0" y="1074.7999999999997">before: No accepted answer</tspan></text><rect x="263.0" y="1062.7999999999997" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.done.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="269.0" y="1074.7999999999997">after: Answer found, or bounded</tspan><tspan x="269.0" y="1086.3999999999996">no-answer exit</tspan></text><text id="label.done.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="243.0" y="1074.7999999999997">-&gt;</tspan></text><text id="label.done.6" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="1113.9999999999998">input input: episode / episode@stopped</tspan></text></g><circle id="port.done.input" cx="48.0" cy="1093.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g></svg>
