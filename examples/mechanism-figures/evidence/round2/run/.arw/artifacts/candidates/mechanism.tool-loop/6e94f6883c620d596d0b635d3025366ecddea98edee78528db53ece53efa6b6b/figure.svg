<svg xmlns="http://www.w3.org/2000/svg" width="180.0mm" height="384.175mm" viewBox="0 0 510.23622047244095 1089.0000000000002"><desc>{"source_sha256": "1de5370d75152f7cdece64ca9cd5a19e89003a6f77da4d9ab77d7f775252b2f3", "profile": "Author-defined synthetic mechanism profile, 180 mm, 8 pt minimum; not venue certification", "candidate_exception": "Milestone 1: author-specified mechanism layout; three explanation strategies are deferred."}</desc><text id="mechanism.claim" font-size="9.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="18.0">[synthetic] An observation updates episode state; an explicit predicate selects</tspan><tspan x="12" y="31.049999999999997">retry or stop.</tspan></text><text id="mechanism.question" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="43.0">When does the tool loop return and when does it stop?</tspan></text><defs><marker id="arrow.data" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#0072b2" /></marker><marker id="arrow.condition" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#7a5195" /></marker><marker id="arrow.control" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#333333" /></marker><marker id="arrow.retrieval" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#00796b" /></marker><marker id="arrow.action" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#a85100" /></marker><marker id="arrow.observation" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#005f73" /></marker><marker id="arrow.supervision" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#8c2d5d" /></marker><marker id="arrow.parameter_update" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#8b0000" /></marker></defs><polyline id="edge.call" points="458.0,147.5 478.0,147.5 478.0,249.0 30.0,249.0 30.0,359.5 48.0,359.5" fill="none" stroke="#a85100" stroke-width="1.2" stroke-dasharray="" marker-end="url(#arrow.action)" /><text id="edge-label.call" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="463.0" y="140.5">call</tspan></text><text id="relation.call" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="928.0">call [action]: lookup request and arguments; when always</tspan></text><polyline id="edge.observed" points="458.0,359.5 478.0,359.5 478.0,476.0 30.0,476.0 30.0,581.5 48.0,581.5" fill="none" stroke="#005f73" stroke-width="1.2" stroke-dasharray="5 2" marker-end="url(#arrow.observation)" /><text id="edge-label.observed" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="463.0" y="352.5">observed</tspan></text><text id="relation.observed" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="962.0">observed [observation]: updated episode and history; when always</tspan></text><polyline id="edge.retry" points="458.0,552.3333333333334 490.0,552.3333333333334 490.0,60.0 24.0,60.0 24.0,147.5 48.0,147.5" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#arrow.control)" /><text id="edge-label.retry" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="463.0" y="545.3333333333334">retry</tspan></text><text id="relation.retry" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="996.0">retry [control]: same observed episode; when not answer_present AND attempts &lt; 2; feedback</tspan></text><polyline id="edge.stop" points="458.0,610.6666666666666 478.0,610.6666666666666 478.0,693.0 30.0,693.0 30.0,791.0 48.0,791.0" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#arrow.control)" /><text id="edge-label.stop" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="463.0" y="603.6666666666666">stop</tspan></text><text id="relation.stop" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="1030.0">stop [control]: terminal episode; when answer_present OR attempts &gt;= 2</tspan></text><g id="component.request"><rect id="body.request" x="48.0" y="70.0" width="410.0" height="155.0" rx="0" fill="#ffffff" stroke="#555555" stroke-width="1" /><g id="content.request"><text id="label.request.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="88.0">Prepare a deterministic tool request</tspan></text><text id="label.request.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="99.6">conceptual | inference | parameters: not_applicable</tspan></text><rect x="60.0" y="108.19999999999999" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.request.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="119.19999999999999">1. Initial state: attempts=0 and answer_present=false.</tspan></text><line x1="253.0" x2="253.0" y1="127.79999999999998" y2="135.79999999999998" stroke="#0072b2" stroke-width="1" marker-end="url(#arrow.data)" /><rect x="60.0" y="136.79999999999998" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.request.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="147.79999999999998">2. Increment attempts; request lookup(key=public-toy).</tspan></text><text id="label.request.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="169.39999999999998">input input: episode / episode@observed</tspan></text><text id="label.request.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="180.99999999999997">output out: request / call@prepared</tspan></text></g><circle id="port.request.input" cx="48.0" cy="147.5" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.request.out" cx="458.0" cy="147.5" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.observe"><rect id="body.observe" x="48.0" y="267.0" width="410.0" height="185.0" rx="0" fill="#ffffff" stroke="#555555" stroke-width="1" /><g id="content.observe"><text id="label.observe.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="285.0">Read observation and update state</tspan></text><text id="label.observe.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="296.6">conceptual | inference | parameters: not_applicable</tspan></text><rect x="60.0" y="305.20000000000005" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.observe.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="316.20000000000005">1. Synthetic lookup returns found or missing.</tspan></text><line x1="253.0" x2="253.0" y1="324.80000000000007" y2="332.80000000000007" stroke="#0072b2" stroke-width="1" marker-end="url(#arrow.data)" /><rect x="60.0" y="333.80000000000007" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.observe.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="344.80000000000007">2. Append observation to event history.</tspan></text><line x1="253.0" x2="253.0" y1="353.4000000000001" y2="361.4000000000001" stroke="#0072b2" stroke-width="1" marker-end="url(#arrow.data)" /><rect x="60.0" y="362.4000000000001" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.observe.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="373.4000000000001">3. Set answer_present=(observation == found).</tspan></text><text id="label.observe.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="395.0000000000001">input input: request / call@prepared</tspan></text><text id="label.observe.6" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="406.60000000000014">output out: episode / episode@observed</tspan></text></g><circle id="port.observe.input" cx="48.0" cy="359.5" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.observe.out" cx="458.0" cy="359.5" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.decide"><rect id="body.decide" x="48.0" y="494.0" width="410.0" height="175.0" rx="8" fill="#eff7fb" stroke="#0072b2" stroke-width="2" /><g id="content.decide"><text id="label.decide.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="512.0">INNOVATION: Bounded return or stop</tspan></text><text id="label.decide.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="523.6">conceptual | inference | parameters: not_applicable</tspan></text><text id="label.decide.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="540.2">Check answer_present and attempts &lt; 2.</tspan></text><rect x="60.0" y="543.8000000000001" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.decide.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="66.0" y="555.8000000000001">continue: not answer_present AND</tspan><tspan x="66.0" y="567.4000000000001"> attempts &lt; 2</tspan></text><rect x="263.0" y="543.8000000000001" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.decide.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="269.0" y="555.8000000000001">stop: answer_present OR attempts</tspan><tspan x="269.0" y="567.4000000000001"> &gt;= 2</tspan></text><text id="label.decide.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="595.0000000000001">input input: episode / episode@observed</tspan></text><text id="label.decide.6" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="606.6000000000001">output again: episode / episode@observed</tspan></text><text id="label.decide.7" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="618.2000000000002">output done: episode / episode@stopped</tspan></text></g><circle id="port.decide.input" cx="48.0" cy="581.5" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.decide.again" cx="458.0" cy="552.3333333333334" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.decide.done" cx="458.0" cy="610.6666666666666" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.done"><rect id="body.done" x="48.0" y="711.0" width="410.0" height="160.0" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1" /><g id="content.done"><text id="label.done.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="729.0">Terminal episode state</tspan></text><text id="label.done.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="740.6">conceptual | inference | parameters: not_applicable</tspan></text><text id="label.done.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="757.2">Return retained observation, without another request.</tspan></text><rect x="60.0" y="760.8000000000001" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.done.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="66.0" y="772.8000000000001">before: No accepted answer</tspan></text><rect x="263.0" y="760.8000000000001" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.done.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="269.0" y="772.8000000000001">after: Answer found, or bounded</tspan><tspan x="269.0" y="784.4000000000001">no-answer exit</tspan></text><text id="label.done.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="243.0" y="772.8000000000001">-&gt;</tspan></text><text id="label.done.6" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="812.0000000000001">input input: episode / episode@stopped</tspan></text></g><circle id="port.done.input" cx="48.0" cy="791.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g></svg>
