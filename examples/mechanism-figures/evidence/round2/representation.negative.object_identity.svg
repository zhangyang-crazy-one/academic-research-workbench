ll="#222222"><tspan x="60.0" y="410.0000000000001">input input: tokens / utterance@tokens</tspan></text><text id="label.project.6" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="421.60000000000014">output out: vector2 / unrelated@sum</tspan></text></g><circle id="port.project.input" cx="48.0" cy="374.5" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.project.out" cx="458.0" cy="374.5" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.result"><rect id="body.result" x="48.0" y="509.0" width="410.0" height="160.0" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1" /><g id="content.result"><text id="label.result.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="527.0">Representation before and after</tspan></text><text id="label.result.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="538.6">conceptual | inference | parameters: not_applicable</tspan></text><text id="label.result.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="555.2">Retain the utterance identity; no trained attention.</tspan></text><rect x="60.0" y="558.8000000000001" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.result.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="66.0" y="570.8000000000001">before: red, blue (ordered</tspan><tspan x="66.0" y="582.4000000000001">tokens)</tspan></text><rect x="263.0" y="558.8000000000001" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.result.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="269.0" y="570.8000000000001">after: y=[1,1] (two-dimensional</tspan><tspan x="269.0" y="582.4000000000001">count vector)</tspan></text><text id="label.result.5" font-