span></text><text id="label.tokens.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="116.19999999999999">Use the supplied two-token vocabulary.</tspan></text><rect x="60.0" y="119.79999999999998" width="175.5" height="19.6" fill="#eef6fa" stroke="#0072b2" stroke-width="0.8" /><rect x="270.5" y="119.79999999999998" width="175.5" height="19.6" fill="#eef6fa" stroke="#0072b2" stroke-width="0.8" /><text id="label.tokens.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="66.0" y="130.79999999999998">tok0: red</tspan></text><text id="label.tokens.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="241.5" y="130.79999999999998">-&gt;</tspan></text><text id="label.tokens.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="276.5" y="130.79999999999998">e_red</tspan></text><rect x="60.0" y="143.39999999999998" width="175.5" height="19.6" fill="#eef6fa" stroke="#0072b2" stroke-width="0.8" /><rect x="270.5" y="143.39999999999998" width="175.5" height="19.6" fill="#eef6fa" stroke="#0072b2" stroke-width="0.8" /><text id="label.tokens.6" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="66.0" y="154.39999999999998">tok1: blue</tspan></text><text id="label.tokens.7" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="241.5" y="154.39999999999998">-&gt;</tspan></text><text id="label.tokens.8" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="276.5" y="154.39999999999998">e_blue</tspan></text><text id="label.tokens.9" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="174.99999999999997">axes: sequence axis: tok0,tok1; embedding axis: red,blue</tspan></text><text id="label.tokens.10" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="191.59999999999997">