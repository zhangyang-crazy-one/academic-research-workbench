<svg xmlns="http://www.w3.org/2000/svg" width="180.0mm" height="285.397mm" viewBox="0 0 510.23622047244095 808.9993700787402"><desc>{"source_sha256": "19a4f7717679c7cd52aeccfe2551677e74dd0e57e32600c57848475a627dc374", "profile": "Author-defined synthetic mechanism profile, 180 mm, 8 pt minimum; not venue certification", "candidate_exception": "Milestone 1: author-specified mechanism layout; three explanation strategies are deferred."}</desc><text id="mechanism.claim" font-size="9.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="18.0">[synthetic] A penguin counterexample yields an explicit exception without inventing</tspan><tspan x="12" y="31.049999999999997"> observations.</tspan></text><text id="mechanism.question" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="43.0">How does a retained counterexample revise a semantic constraint?</tspan></text><defs><marker id="arrow.data" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#0072b2" /></marker><marker id="arrow.condition" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#7a5195" /></marker><marker id="arrow.control" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#333333" /></marker><marker id="arrow.retrieval" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#00796b" /></marker><marker id="arrow.action" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#a85100" /></marker><marker id="arrow.observation" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#005f73" /></marker><marker id="arrow.supervision" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#8c2d5d" /></marker><marker id="arrow.parameter_update" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#8b0000" /></marker></defs><polyline id="edge.counterexample" points="48.0,364.5 30.0,364.5 30.0,254.0 478.0,254.0 478.0,150.0 458.0,150.0" fill="none" stroke="#0072b2" stroke-width="1.2" stroke-dasharray="" marker-end="url(#arrow.data)" /><text id="edge-label.counterexample" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="463.0" y="143.0">countere</tspan><tspan x="463.0" y="154.6">xample</tspan></text><text id="relation.counterexample" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="716.0">counterexample [data]: original rule plus counterexample; when always</tspan></text><polyline id="edge.guard" points="458.0,364.5 478.0,364.5 478.0,481.0 30.0,481.0 30.0,579.0 48.0,579.0" fill="none" stroke="#0072b2" stroke-width="1.2" stroke-dasharray="" marker-end="url(#arrow.data)" /><text id="edge-label.guard" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="463.0" y="357.5">guard</tspan></text><text id="relation.guard" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="750.0">guard [data]: guarded rule; unknown flight retained; when always</tspan></text><g id="component.before"><rect id="body.before" x="48.0" y="70.0" width="410.0" height="160.0" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1" /><g id="content.before"><text id="label.before.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="88.0">Original rule and counterexample</tspan></text><text id="label.before.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="99.6">conceptual | inference | parameters: not_applicable</tspan></text><text id="label.before.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="116.19999999999999">Toy domain: birds, penguins and possible flight.</tspan></text><text id="label.before.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="127.79999999999998">Counterexample: penguin is a bird that cannot fly.</tspan></text><rect x="60.0" y="131.39999999999998" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.before.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="66.0" y="143.39999999999998">before: bird -&gt; may_fly</tspan></text><rect x="263.0" y="131.39999999999998" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.before.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="269.0" y="143.39999999999998">after: Counterexample is</tspan><tspan x="269.0" y="154.99999999999997">retained</tspan></text><text id="label.before.6" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="243.0" y="143.39999999999998">-&gt;</tspan></text><text id="label.before.7" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="182.59999999999997">output out: rule / rule@counterexample</tspan></text></g><circle id="port.before.out" cx="458.0" cy="150.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.revise"><rect id="body.revise" x="48.0" y="272.0" width="410.0" height="185.0" rx="0" fill="#eff7fb" stroke="#0072b2" stroke-width="2" /><g id="content.revise"><text id="label.revise.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="290.0">INNOVATION: Add a sourced exception guard</tspan></text><text id="label.revise.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="301.6">conceptual | inference | parameters: not_applicable</tspan></text><rect x="60.0" y="310.20000000000005" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.revise.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="321.20000000000005">1. Retain bird(penguin).</tspan></text><line x1="253.0" x2="253.0" y1="329.80000000000007" y2="337.80000000000007" stroke="#0072b2" stroke-width="1" marker-end="url(#arrow.data)" /><rect x="60.0" y="338.80000000000007" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.revise.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="349.80000000000007">2. Exclude penguins from may_fly rule.</tspan></text><line x1="253.0" x2="253.0" y1="358.4000000000001" y2="366.4000000000001" stroke="#0072b2" stroke-width="1" marker-end="url(#arrow.data)" /><rect x="60.0" y="367.4000000000001" width="386.0" height="19.6" fill="#ffffff" stroke="#0072b2" stroke-width="0.7" /><text id="label.revise.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="70.0" y="378.4000000000001">3. Keep other birds as unknown, not observed flight.</tspan></text><text id="label.revise.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="400.0000000000001">input input: rule / rule@counterexample</tspan></text><text id="label.revise.6" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="411.60000000000014">output out: rule / rule@guarded</tspan></text></g><circle id="port.revise.input" cx="48.0" cy="364.5" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.revise.out" cx="458.0" cy="364.5" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.after"><rect id="body.after" x="48.0" y="499.0" width="410.0" height="160.0" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1" /><g id="content.after"><text id="label.after.0" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="517.0">Revised constraint with a known limit</tspan></text><text id="label.after.1" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="528.6">conceptual | inference | parameters: not_applicable</tspan></text><text id="label.after.2" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="545.2">No inference that every other bird actually flies.</tspan></text><rect x="60.0" y="548.8000000000001" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.after.3" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="66.0" y="560.8000000000001">before: Unconditional bird rule</tspan></text><rect x="263.0" y="548.8000000000001" width="183.0" height="33.2" fill="#ffffff" stroke="#555555" stroke-width="0.8" /><text id="label.after.4" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="269.0" y="560.8000000000001">after: bird AND not penguin -&gt;</tspan><tspan x="269.0" y="572.4000000000001">may_fly (conceptual)</tspan></text><text id="label.after.5" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="243.0" y="560.8000000000001">-&gt;</tspan></text><text id="label.after.6" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="60.0" y="600.0000000000001">input input: rule / rule@guarded</tspan></text></g><circle id="port.after.input" cx="48.0" cy="579.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g></svg>
