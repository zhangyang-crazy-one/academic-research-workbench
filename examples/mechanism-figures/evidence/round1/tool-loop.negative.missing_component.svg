<svg xmlns="http://www.w3.org/2000/svg" width="180.0mm" height="390.172mm" viewBox="0 0 510.23622047244095 1105.9993700787402"><desc>{"source_sha256": "ae44c1bd91129da587db07a4a7d29cf8ac4ea616f72e0204b1bedf5b7b26cd5b", "profile": "Author-defined synthetic mechanism profile, 180 mm, 8 pt minimum; not venue certification", "candidate_exception": "Milestone 1: author-specified mechanism layout; three explanation strategies are deferred."}</desc><text id="mechanism.claim" font-size="9.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="18.0">[synthetic] An observation updates episode state; an explicit predicate selects ret</tspan><tspan x="12" y="31.049999999999997">ry or stop.</tspan></text><text id="mechanism.question" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="43.0">When does the tool loop return and when does it stop?</tspan></text><defs><marker id="arrow.data" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#0072b2" /></marker><marker id="arrow.condition" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#7a5195" /></marker><marker id="arrow.control" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#333333" /></marker><marker id="arrow.retrieval" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#00796b" /></marker><marker id="arrow.action" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#a85100" /></marker><marker id="arrow.observation" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#005f73" /></marker><marker id="arrow.supervision" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#8c2d5d" /></marker><marker id="arrow.parameter_update" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#8b0000" /></marker></defs><polyline id="edge.call" points="458.0,155.0 478.0,155.0 478.0,267.0 30.0,267.0 30.0,370.0 48.0,370.0" fill="none" stroke="#a85100" stroke-width="1.2" stroke-dasharray="" marker-end="url(#arrow.action)" /><text id="relation.call" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="945.0">call [action]: lookup request and arguments; when always</tspan></text><polyline id="edge.observed" points="458.0,370.0 478.0,370.0 478.0,482.0 30.0,482.0 30.0,585.0 48.0,585.0" fill="none" stroke="#005f73" stroke-width="1.2" stroke-dasharray="5 2" marker-end="url(#arrow.observation)" /><text id="relation.observed" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="979.0">observed [observation]: updated episode and history; when always</tspan></text><polyline id="edge.retry" points="458.0,556.6666666666666 490.0,556.6666666666666 490.0,60.0 24.0,60.0 24.0,155.0 48.0,155.0" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#arrow.control)" /><text id="relation.retry" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="1013.0">retry [control]: same observed episode; when not answer_present AND attempts &lt; 2; feedback</tspan></text><polyline id="edge.stop" points="458.0,613.3333333333334 478.0,613.3333333333334 478.0,697.0 30.0,697.0 30.0,800.0 48.0,800.0" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#arrow.control)" /><text id="relation.stop" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="1047.0">stop [control]: terminal episode; when answer_present OR attempts &gt;= 2</tspan></text><g id="component.observe"><rect id="body.observe" x="48.0" y="285.0" width="410.0" height="170.0" rx="0" fill="#ffffff" stroke="#555555" stroke-width="1" /><text id="content.observe" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="58.0" y="301.0">Read observation and update state</tspan><tspan x="58.0" y="312.6">conceptual | inference | parameters: not_applicable</tspan><tspan x="58.0" y="324.2">1. Tool returns observation=found.</tspan><tspan x="58.0" y="335.8">2. Append observation to event history.</tspan><tspan x="58.0" y="347.4">3. Set answer_present=true.</tspan><tspan x="58.0" y="359.0">input input: request / call@prepared</tspan><tspan x="58.0" y="370.6">output out: episode / episode@observed</tspan></text><circle id="port.observe.input" cx="48.0" cy="370.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.observe.out" cx="458.0" cy="370.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.decide"><rect id="body.decide" x="48.0" y="500.0" width="410.0" height="170.0" rx="8" fill="#eff7fb" stroke="#0072b2" stroke-width="2" /><text id="content.decide" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="58.0" y="516.0">INNOVATION</tspan><tspan x="58.0" y="527.6">Bounded return or stop</tspan><tspan x="58.0" y="539.2">conceptual | inference | parameters: not_applicable</tspan><tspan x="58.0" y="550.8">1. Check answer_present and attempts &lt; 2.</tspan><tspan x="58.0" y="562.4">continue: not answer_present AND attempts &lt; 2</tspan><tspan x="58.0" y="574.0">stop: answer_present OR attempts &gt;= 2</tspan><tspan x="58.0" y="585.6">input input: episode / episode@observed</tspan><tspan x="58.0" y="597.2">output again: episode / episode@observed</tspan><tspan x="58.0" y="608.8">output done: episode / episode@stopped</tspan></text><circle id="port.decide.input" cx="48.0" cy="585.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.decide.again" cx="458.0" cy="556.6666666666666" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.decide.done" cx="458.0" cy="613.3333333333334" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.done"><rect id="body.done" x="48.0" y="715.0" width="410.0" height="170.0" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1" /><text id="content.done" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="58.0" y="731.0">Terminal episode state</tspan><tspan x="58.0" y="742.6">conceptual | inference | parameters: not_applicable</tspan><tspan x="58.0" y="754.2">1. Return retained observation, without another request.</tspan><tspan x="58.0" y="765.8">before: No accepted answer</tspan><tspan x="58.0" y="777.4">after: Answer found, or bounded no-answer exit</tspan><tspan x="58.0" y="789.0">input input: episode / episode@stopped</tspan></text><circle id="port.done.input" cx="48.0" cy="800.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g></svg>
