<svg xmlns="http://www.w3.org/2000/svg" width="180.0mm" height="290.336mm" viewBox="0 0 510.23622047244095 822.9996850393702"><desc>{"source_sha256": "19a4f7717679c7cd52aeccfe2551677e74dd0e57e32600c57848475a627dc374", "profile": "Author-defined synthetic mechanism profile, 180 mm, 8 pt minimum; not venue certification", "candidate_exception": "Milestone 1: author-specified mechanism layout; three explanation strategies are deferred."}</desc><text id="mechanism.claim" font-size="9.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="18.0">[synthetic] A penguin counterexample yields an explicit exception without inventing</tspan><tspan x="12" y="31.049999999999997"> observations.</tspan></text><text id="mechanism.question" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="43.0">How does a retained counterexample revise a semantic constraint?</tspan></text><defs><marker id="arrow.data" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#0072b2" /></marker><marker id="arrow.condition" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#7a5195" /></marker><marker id="arrow.control" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#333333" /></marker><marker id="arrow.retrieval" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#00796b" /></marker><marker id="arrow.action" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#a85100" /></marker><marker id="arrow.observation" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#005f73" /></marker><marker id="arrow.supervision" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#8c2d5d" /></marker><marker id="arrow.parameter_update" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#8b0000" /></marker></defs><polyline id="edge.counterexample" points="458.0,155.0 478.0,155.0 478.0,267.0 30.0,267.0 30.0,370.0 48.0,370.0" fill="none" stroke="#0072b2" stroke-width="1.2" stroke-dasharray="" marker-end="url(#arrow.data)" /><text id="relation.counterexample" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="730.0">counterexample [data]: original rule plus counterexample; when always</tspan></text><polyline id="edge.guard" points="458.0,370.0 478.0,370.0 478.0,482.0 30.0,482.0 30.0,585.0 48.0,585.0" fill="none" stroke="#0072b2" stroke-width="1.2" stroke-dasharray="" marker-end="url(#arrow.data)" /><text id="relation.guard" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="764.0">guard [data]: guarded rule; unknown flight retained; when always</tspan></text><g id="component.revise"><rect id="body.revise" x="48.0" y="285.0" width="410.0" height="170.0" rx="0" fill="#eff7fb" stroke="#0072b2" stroke-width="2" /><text id="content.revise" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="58.0" y="301.0">INNOVATION</tspan><tspan x="58.0" y="312.6">Add a sourced exception guard</tspan><tspan x="58.0" y="324.2">conceptual | inference | parameters: not_applicable</tspan><tspan x="58.0" y="335.8">1. Retain bird(penguin).</tspan><tspan x="58.0" y="347.4">2. Exclude penguins from may_fly rule.</tspan><tspan x="58.0" y="359.0">3. Keep other birds as unknown, not observed flight.</tspan><tspan x="58.0" y="370.6">input input: rule / rule@counterexample</tspan><tspan x="58.0" y="382.2">output out: rule / rule@guarded</tspan></text><circle id="port.revise.input" cx="48.0" cy="370.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.revise.out" cx="458.0" cy="370.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.after"><rect id="body.after" x="48.0" y="500.0" width="410.0" height="170.0" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1" /><text id="content.after" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="58.0" y="516.0">Revised constraint with a known limit</tspan><tspan x="58.0" y="527.6">conceptual | inference | parameters: not_applicable</tspan><tspan x="58.0" y="539.2">1. No inference that every other bird actually flies.</tspan><tspan x="58.0" y="550.8">before: Unconditional bird rule</tspan><tspan x="58.0" y="562.4">after: bird AND not penguin -&gt; may_fly (conceptual)</tspan><tspan x="58.0" y="574.0">input input: rule / rule@guarded</tspan></text><circle id="port.after.input" cx="48.0" cy="585.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g></svg>
