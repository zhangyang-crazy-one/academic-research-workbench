<svg xmlns="http://www.w3.org/2000/svg" width="180.0mm" height="290.336mm" viewBox="0 0 510.23622047244095 822.9996850393702"><desc>{"source_sha256": "71ddcec9e0aa4e0ff2a7b09e271fb5b351be85de601f1edbbd52b7572aa64b49", "profile": "Author-defined synthetic mechanism profile, 180 mm, 8 pt minimum; not venue certification", "candidate_exception": "Milestone 1: author-specified mechanism layout; three explanation strategies are deferred."}</desc><text id="mechanism.claim" font-size="9.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="18.0">[synthetic] One-hot lookup then sequence summation produces the supplied count vect</tspan><tspan x="12" y="31.049999999999997">or.</tspan></text><text id="mechanism.question" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="12" y="43.0">How does this fixed token sequence become a count vector?</tspan></text><defs><marker id="arrow.data" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#0072b2" /></marker><marker id="arrow.condition" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#7a5195" /></marker><marker id="arrow.control" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#333333" /></marker><marker id="arrow.retrieval" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#00796b" /></marker><marker id="arrow.action" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#a85100" /></marker><marker id="arrow.observation" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#005f73" /></marker><marker id="arrow.supervision" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#8c2d5d" /></marker><marker id="arrow.parameter_update" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#8b0000" /></marker></defs><polyline id="edge.lookup" points="458.0,160.0 478.0,160.0 478.0,267.0 30.0,267.0 30.0,370.0 48.0,370.0" fill="none" stroke="#0072b2" stroke-width="1.2" stroke-dasharray="" marker-end="url(#arrow.data)" /><text id="relation.lookup" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="730.0">lookup [data]: ordered token IDs; when always</tspan></text><polyline id="edge.sum" points="458.0,370.0 478.0,370.0 478.0,482.0 30.0,482.0 30.0,585.0 48.0,585.0" fill="none" stroke="#0072b2" stroke-width="1.2" stroke-dasharray="" marker-end="url(#arrow.data)" /><text id="relation.sum" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="20.0" y="764.0">sum [data]: two-dimensional count vector; when always</tspan></text><g id="component.project"><rect id="body.project" x="48.0" y="285.0" width="410.0" height="170.0" rx="0" fill="#eff7fb" stroke="#0072b2" stroke-width="2" /><text id="content.project" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="58.0" y="301.0">INNOVATION</tspan><tspan x="58.0" y="312.6">Sum the supplied one-hot vectors</tspan><tspan x="58.0" y="324.2">conceptual | inference | parameters: frozen</tspan><tspan x="58.0" y="335.8">1. E(red)=[1,0]; E(blue)=[0,1].</tspan><tspan x="58.0" y="347.4">2. Lookup X=[E(red), E(blue)].</tspan><tspan x="58.0" y="359.0">3. Sum sequence axis: y=[1,1].</tspan><tspan x="58.0" y="370.6">input input: tokens / utterance@tokens</tspan><tspan x="58.0" y="382.2">output out: vector2 / utterance@sum</tspan></text><circle id="port.project.input" cx="48.0" cy="370.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /><circle id="port.project.out" cx="458.0" cy="370.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g><g id="component.result"><rect id="body.result" x="48.0" y="500.0" width="410.0" height="170.0" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1" /><text id="content.result" font-size="8.0" font-family="Noto Sans CJK SC, sans-serif" fill="#222222"><tspan x="58.0" y="516.0">Representation before and after</tspan><tspan x="58.0" y="527.6">conceptual | inference | parameters: not_applicable</tspan><tspan x="58.0" y="539.2">1. Retain the utterance identity; no trained attention.</tspan><tspan x="58.0" y="550.8">before: red, blue (ordered tokens)</tspan><tspan x="58.0" y="562.4">after: y=[1,1] (two-dimensional count vector)</tspan><tspan x="58.0" y="574.0">input input: vector2 / utterance@sum</tspan></text><circle id="port.result.input" cx="48.0" cy="585.0" r="3" fill="#ffffff" stroke="#222222" stroke-width="1" /></g></svg>
