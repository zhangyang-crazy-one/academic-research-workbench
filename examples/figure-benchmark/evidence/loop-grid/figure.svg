<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="330mm" viewBox="0 0 510.23622 935.433071"><desc>Input starts analysis; completion exits, otherwise control returns; data flow is distinct.</desc><text x="10" y="24" font-size="11" font-family="Noto Sans CJK SC, sans-serif"><tspan x="10" dy="0">(a) Observed source</tspan></text><g id="arw_panel_1" transform="translate(10 106.792651) scale(0.531374)"><g><g font-family="Noto Sans CJK SC, sans-serif"><circle cx="20" cy="20" r="8" fill="#0072B2" stroke="#222222" stroke-width="1" /><line x1="34" y1="20" x2="58" y2="20" stroke="#0072B2" stroke-width="2" stroke-dasharray="" /><text x="68" y="25" font-size="16"><tspan x="68" dy="0">sample / observed</tspan></text><g id="arw_panel_1__observation.a"><rect x="8" y="48" width="420" height="76" fill="#ffffff" stroke="#0072B2" stroke-width="2" /><text x="20" y="70" font-size="16"><tspan x="20" dy="0">观测 A / observation A</tspan></text></g><g id="arw_panel_1__observation.b"><text x="20" y="154" font-size="16"><tspan x="20" dy="0">x = 0.831; y = 0.832</tspan></text></g></g></g></g><text x="261.11811" y="24" font-size="11" font-family="Noto Sans CJK SC, sans-serif"><tspan x="261.11811" dy="0">(b) Conditional control loop</tspan></text><g id="arw_panel_2" transform="translate(261.11811 100.150481) scale(0.265687)"><g><g font-family="Noto Sans CJK SC, sans-serif"><defs><marker id="arw_panel_2__arrow.control.next" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#333333" /></marker></defs><g id="arw_panel_2__control.next"><path d="M28,80 L430,80 L430,220 L28,220 L28,220" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="" marker-end="url(#arw_panel_2__arrow.control.next)" /><text x="435" y="150.0" font-size="14"><tspan x="435" dy="0">(1)</tspan></text><text x="580" y="80" font-size="14"><tspan x="580" dy="0">(1) control: start analysis</tspan></text></g><defs><marker id="arw_panel_2__arrow.control.stop" markerWidt