<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="512" height="512" viewBox="0 0 512 512">
<title>Cabinet door</title>
<desc>Preserves slim top/side planes, recessed beveled rectangular panel, two detailed hinge barrels with screw leaves, and long two-mount pull. Raster halo removed to ensure clean transparency.</desc>
<g stroke-linecap="round" stroke-linejoin="round"><g inkscape:label="Door slim side" ><polygon points="137,80 154,72 390,85 390,416 378,427 137,402" fill="#B8D9E4" stroke="#203B56" stroke-width="3.4"/></g><g inkscape:label="Main door face" ><polygon points="137,80 378,94 378,427 137,402" fill="#F5F8FA" stroke="#203B56" stroke-width="4"/></g><g inkscape:label="Recessed framed panel" ><polygon points="175,114 346,123 346,393 175,375" fill="#F5F8FA" stroke="#203B56" stroke-width="3.2"/><polygon points="187,126 334,135 334,379 187,364" fill="#F5F8FA" stroke="#203B56" stroke-width="3.2"/><path d="M175 114L187 126 M346 123L334 135 M346 393L334 379 M175 375L187 364" fill="none" stroke="#203B56" stroke-width="2.7"/></g><g inkscape:label="Hinge leaf" ><path d="M140 130L161 132Q167 132 167 138V173Q167 179 161 178L140 176Z" fill="#8EBFC8" stroke="#203B56" stroke-width="2.8"/><circle cx="157" cy="143" r="4.4" fill="#B8D9E4" stroke="#203B56" stroke-width="2.2"/><circle cx="157" cy="167" r="4.4" fill="#B8D9E4" stroke="#203B56" stroke-width="2.2"/></g><g inkscape:label="Hinge barrel" ><rect x="132" y="120" width="14" height="68" rx="7" fill="#8EBFC8" stroke="#203B56" stroke-width="3"/><path d="M133 127Q139 130 145 127 M133 142Q139 146 145 143 M133 169Q139 173 145 170 M133 182Q139 185 145 182" fill="none" stroke="#203B56" stroke-width="2.4"/></g><g inkscape:label="Hinge leaf" ><path d="M140 321L161 323Q167 323 167 329V364Q167 370 161 369L140 367Z" fill="#8EBFC8" stroke="#203B56" stroke-width="2.8"/><circle cx="157" cy="334" r="4.4" fill="#B8D9E4" stroke="#203B56" stroke-width="2.2"/><circle cx="157" cy="358" r="4.4" fill="#B8D9E4" stroke="#203B56" stroke-width="2.2"/></g><g inkscape:label="Hinge barrel" ><rect x="132" y="311" width="14" height="68" rx="7" fill="#8EBFC8" stroke="#203B56" stroke-width="3"/><path d="M133 318Q139 321 145 318 M133 333Q139 337 145 334 M133 360Q139 364 145 361 M133 373Q139 376 145 373" fill="none" stroke="#203B56" stroke-width="2.4"/></g><g inkscape:label