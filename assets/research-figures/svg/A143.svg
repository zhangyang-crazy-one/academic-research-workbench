<title>Push cart</title>
<desc>Preserves open tray, tall U-shaped handle and detailed caster forks. The prototype visibly exposes three casters; the fourth rear caster is slightly extended below the tray for partial visibility to satisfy the planned four-wheel structure.</desc>
