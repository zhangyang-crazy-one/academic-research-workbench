<title>Irregular rock</title>
<desc>Preserves asymmetrical rock silhouette while consolidating two small right-side subdivisions from the generated prototype into five broad facets, matching the planned count.</desc>
<g stroke-linecap="round" stroke-linejoin="round"><g inkscape:label="Five-facet rock silhouette and lower right face" ><polygon points="91,291 128,245 135,220 171,173 187,155 293,164 321,189 335,196 344,218 393,244 414,300 384,330 338,358 222,378 173,370 101,329" fill="#B8D9E4" stroke="#203B56" stroke-width="4.2"/></g><g inkscape:label="Upper facet" ><polygon points="171,173 187,155 293,164 321,189 235,215" fill="#F5F8FA" stroke="#203B56" stroke-width="3.3"/></g><g inkscape:label="Left shoulder facet" ><polygon points="91,291 128,245 135,220 171,173 235,215 213,262 166,291 117,305" fill="#E4F2F7" stroke="#203B56" stroke-width="3.3"/></g><g inkscape:label="Broad central facet" ><polygon points="166,291 213,262 235,215 321,189 335,196 344,218 369,264 324,344 202,336" fill="#F5F8FA" stroke="#203B56" stroke-width="3.3"/></g><g inkscape:label="Lower left facet" ><polygon points="91,291 117,305 166,291 202,336 173,370 101,329" fill="#8EBFC8" stroke="#203B56" stroke-width="3.3"/></g></g></svg>